<script type="text/javascript">
    (function () {
        function hasProperty (obj, prop) {
            return Object.prototype.hasOwnProperty.call(obj, prop)
        }
        const validateTypedInput = hasProperty(RED.validators, 'typedInput') ? RED.validators.typedInput('payloadType') : function (v) { return true }
        // navigate/popup/modal payloads point at a page or dialog group that must still exist
        function validatePayload (v, opt) {
            const type = $('#node-input-payloadType').val() || this.payloadType
            if (type === 'navigate') {
                const n = RED.nodes.node(v)
                return ['_back', '_prev', '_next'].includes(v) || (!!n && n.type === 'ui-page')
            }
            if (type === 'popup' || type === 'modal') {
                const n = RED.nodes.node(v)
                return !!n && n.type === 'ui-group' && n.groupType === 'dialog'
            }
            return validateTypedInput.call(this, v, opt)
        }
        RED.nodes.registerType('ui-button', {
            category: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.label.category'),
            color: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.colors.light'),
            defaults: {
                group: { type: 'ui-group', required: true },
                name: { value: '' },
                label: { value: RED._('@flowfuse/node-red-dashboard/ui-button:ui-button.label.button') },
                order: { value: 0 },
                width: {
                    value: 0,
                    validate: function (v) {
                        const width = v || 0
                        const currentGroup = $('#node-input-group').val() || this.group
                        const groupNode = RED.nodes.node(currentGroup)
                        const valid = !groupNode || +width >= 0
                        $('#node-input-size').toggleClass('input-error', !valid)
                        return valid
                    }
                },
                height: { value: 0 },
                emulateClick: { value: false },
                tooltip: { value: '' },
                color: { value: '' },
                bgcolor: { value: '' },
                className: { value: '' },
                icon: { value: '' },
                iconPosition: { value: 'left' },
                payload: { value: '', validate: validatePayload },
                payloadType: { value: 'str' },
                topic: { value: 'topic', validate: (hasProperty(RED.validators, 'typedInput') ? RED.validators.typedInput('topicType') : function (v) { return true }) },
                topicType: { value: 'msg' },
                buttonColor: { value: '' },
                textColor: { value: '' },
                iconColor: { value: '' },
                enableClick: { value: true },
                // pointerup/down event support
                enablePointerdown: { value: false },
                pointerdownPayload: { value: '', validate: (hasProperty(RED.validators, 'typedInput') ? RED.validators.typedInput('pointerdownPayloadType') : function (v) { return true }) },
                pointerdownPayloadType: { value: 'str' },
                enablePointerup: { value: false },
                pointerupPayload: { value: '', validate: (hasProperty(RED.validators, 'typedInput') ? RED.validators.typedInput('pointerupPayloadType') : function (v) { return true }) },
                pointerupPayloadType: { value: 'str' }
            },
            inputs: 1,
            outputs: 1,
            outputLabels: function () {
                if (this.payloadType === 'str') {
                    return this.payload
                } else {
                    return this.payloadType
                }
            },
            icon: 'font-awesome/fa-hand-pointer-o',
            paletteLabel: 'button',
            label: function () { return this.name || (~this.label.indexOf('{' + '{') ? null : this.label) || 'button' },
            labelStyle: function () { return this.name ? 'node_label_italic' : '' },
            oneditprepare: function () {
                $('#node-input-size').ffElementSizer({
                    width: '#node-input-width',
                    height: '#node-input-height',
                    group: '#node-input-group'
                })

                const node = this
                // navigate/popup/modal options are scoped to the dashboard of the selected group
                function clickTypes () {
                    const groupNode = RED.nodes.node($('#node-input-group').val() || node.group)
                    const pageNode = groupNode && RED.nodes.node(groupNode.page)
                    const uiId = pageNode && pageNode.ui
                    const pages = []
                    const dialogs = []
                    RED.nodes.eachConfig(function (n) {
                        if (n.type === 'ui-page' && (!uiId || n.ui === uiId)) {
                            pages.push(n)
                        }
                    })
                    pages.sort((a, b) => (a.order || 0) - (b.order || 0))
                    RED.nodes.eachConfig(function (n) {
                        if (n.type === 'ui-group' && n.groupType === 'dialog') {
                            const p = RED.nodes.node(n.page)
                            if (!uiId || (p && p.ui === uiId)) {
                                dialogs.push({ value: n.id, label: (p ? (p.name || p.path) + ' / ' : '') + (n.name || n.id) })
                            }
                        }
                    })
                    const navigateOptions = [
                        { value: '_back', label: RED._('@flowfuse/node-red-dashboard/ui-button:ui-button.label.navBack') },
                        { value: '_prev', label: RED._('@flowfuse/node-red-dashboard/ui-button:ui-button.label.navPrev') },
                        { value: '_next', label: RED._('@flowfuse/node-red-dashboard/ui-button:ui-button.label.navNext') }
                    ].concat(pages.map(p => ({ value: p.id, label: (p.name || p.id) + (p.path ? ' (' + p.path + ')' : '') })))
                    const dialogOptions = dialogs.length ? dialogs : [{ value: '', label: RED._('@flowfuse/node-red-dashboard/ui-button:ui-button.label.noDialogGroups') }]
                    // keep a deleted target selectable, otherwise typedInput silently swaps it for the first option
                    const missing = { value: node.payload, label: RED._('@flowfuse/node-red-dashboard/ui-button:ui-button.label.missingTarget', { id: node.payload }) }
                    if (node.payloadType === 'navigate' && node.payload && !navigateOptions.some(o => o.value === node.payload)) {
                        navigateOptions.push(missing)
                    }
                    if ((node.payloadType === 'popup' || node.payloadType === 'modal') && node.payload && !dialogs.some(o => o.value === node.payload)) {
                        dialogOptions.push(missing)
                    }
                    return ['str', 'num', 'bool', 'json', 'bin', 'date', 'flow', 'global',
                        { value: 'navigate', label: 'navigate', icon: 'fa fa-share', options: navigateOptions },
                        { value: 'popup', label: 'popup', icon: 'fa fa-window-restore', options: dialogOptions },
                        { value: 'modal', label: 'modal', icon: 'fa fa-window-maximize', options: dialogOptions }
                    ]
                }

                $('#node-input-payload').typedInput({
                    default: 'str',
                    typeField: $('#node-input-payloadType'),
                    types: clickTypes()
                })
                $('#node-input-group').on('change', function () {
                    const $payload = $('#node-input-payload')
                    const type = $payload.typedInput('type')
                    const value = $payload.typedInput('value')
                    $payload.typedInput('types', clickTypes())
                    $payload.typedInput('type', type)
                    $payload.typedInput('value', value)
                })

                $('#node-input-topic').typedInput({
                    default: 'str',
                    typeField: $('#node-input-topicType'),
                    types: ['str', 'msg', 'flow', 'global']
                })

                // backward compatability
                if (typeof this.enableClick === 'undefined') {
                    this.enableClick = true
                    $('#node-input-enableClick').prop('checked', true)
                }

                $('#node-input-enableClick').on('change', function () {
                    if (this.checked) {
                        $('.form-row-click').show()
                    } else {
                        $('.form-row-click').hide()
                    }
                })

                $('#node-input-enablePointerdown').on('change', function () {
                    if (this.checked) {
                        $('.form-row-pointerdown').show()
                    } else {
                        $('.form-row-pointerdown').hide()
                    }
                })

                $('#node-input-pointerdownPayload').typedInput({
                    default: 'str',
                    typeField: $('#node-input-pointerdownPayloadType'),
                    types: ['str', 'num', 'bool', 'json', 'bin', 'date', 'flow', 'global']
                })
    
                $('#node-input-enablePointerup').on('change', function () {
                    if (this.checked) {
                        $('.form-row-pointerup').show()
                    } else {
                        $('.form-row-pointerup').hide()
                    }
                })

                $('#node-input-pointerupPayload').typedInput({
                    default: 'str',
                    typeField: $('#node-input-pointerupPayloadType'),
                    types: ['str', 'num', 'bool', 'json', 'bin', 'date', 'flow', 'global']
                })

                if (!this.iconPosition) {
                    $('#node-input-iconPosition').val('left')
                }

                // use jQuery UI tooltip to convert the plain old title attribute to a nice tooltip
                $('.ui-node-popover-title').tooltip({
                    show: {
                        effect: 'slideDown',
                        delay: 150
                    }
                })
            }
        })
    })()
</script>

        <input type="text" id="node-input-tooltip" data-i18n="[placeholder]ui-button.label.optionalTooltip">
    </div>-->
    <div class="form-row">
        <label style="width:auto" for="node-input-enablePointerdown"><i class="fa fa-hand-pointer-o"></i> <span data-i18n="ui-button.label.enablePointerdown"></span></label>
        <input type="checkbox" id="node-input-enablePointerdown" style="display:inline-block; width:auto; vertical-align:top;">

        <input type="text" id="node-input-pointerdownPayload" style="width:70%">
        <input type="hidden" id="node-input-pointerdownPayloadType">

        <input type="checkbox" id="node-input-enablePointerup" style="display:inline-block; width:auto; vertical-align:top;">

    <div class="form-row form-row-pointerup">
        <label for="node-input-pointerupPayload" style="padding-left: 25px; margin-right: -25px"><span data-i18n="ui-button.label.payload"></label>
        <input type="text" id="node-input-pointerupPayload" style="width:70%">
        <input type="hidden" id="node-input-pointerupPayloadType">
    </div>
    <div class="form-row">
        <label style="width:auto" for="node-input-enableClick"><i class="fa fa-hand-pointer-o"></i> <span data-i18n="ui-button.label.enableClick"></span></label>
