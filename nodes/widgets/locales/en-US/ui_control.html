
<script type="text/html" data-help-name="ui-control">
    <p>Allows dynamic control of the Dashboard.</p>
    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Output</dt>
        <dd>Which events the node sends from its output, see the Events List below. <b>None</b> removes the output. Use it when the node is only sent commands.</dd>
        <dt>On input</dt>
        <dd><b>Use msg.payload</b> controls the Dashboard with the payloads in the Controls List below. <b>Run the actions below</b> ignores <code>msg.payload</code>, and any incoming msg runs the actions set up in the node.</dd>
    </dl>
    <h3>Actions</h3>
    <p>Each action has a target picked from the selected dashboard, or read from a <code>msg</code> property:</p>
    <ul>
        <li><b>Navigate</b> - a page, next page, previous page or refresh. A <code>msg</code> property can hold a page name or id, <code>"+1"</code>, <code>"-1"</code>, <code>""</code> or a page index.</li>
        <li><b>Show/Hide</b> - a page, group or widget. Opens or closes a dialog group.</li>
        <li><b>Enable/Disable</b> - a page, group or widget.</li>
    </ul>
    <p>For Show, Hide, Enable and Disable, a <code>msg</code> property can hold an id or name, or an array of them. <code>"Page:Group"</code>, <code>"Group:Widget"</code> and <code>"Page:Group:Widget"</code> are also accepted. A name used by more than one page, group or widget is an error, so use an id instead.</p>
    <p>Actions run together as one change, grouped by type, rather than in the listed order. "Hide X" then "Show X" leaves X hidden, and only the last Navigate is used.</p>
    <h3>Controls List</h3>
    <h4>Navigation</h4>
    <p>Control which page is shown to a user, by programmatically changing the page.</p>
    <p><b>Change Page:</b> The default function is to change the currently displayed page. The following options are supported for the <code>msg.payload</code></p>
    <ul>
        <li><code>"Page Name"</code> - String</li>
        <li><code>{"page":"Page Name"}</code> - Object</li>
        <li><code>2</code> - The numerical index (from 0) of the page to be displayed</li>
    </ul>
    <p><b>Next/Previous:</b> You can also send string in the format:</p>
    <ul>
        <li><code>"+1"</code> - Next Page</li>
        <li><code>"-1"</code> - Previous Page</li>
    </ul>
    <p><b>Refresh:</b> Sending a blank tab name <code>""</code> will refresh the current page.</p>
    <ul>
        <li><code>""</code></li>
        <li><code>{"page":""}</code></li>
    </ul>
    <h4>Show/Hide Pages & Groups & Widgets</h4>
    <p>Dashboard pages & groups & widgets can be shown and hidden by sending a <code>msg.payload</code> object with the format below. Showing or hiding a dialog group opens or closes the dialog.
    <pre>msg.payload = {
    pages: {
        show: ['&lt;Page Name&gt;',
               '&lt;Page Id&gt;',
               {page: '&lt;Page Name&gt;'},
               {page: '&lt;Page Id&gt;'}],
        hide: ['&lt;Page Id&gt;']
    },
    groups: {
        show: ['&lt;Group Name&gt;',
               '&lt;Group Id&gt;',
               '&lt;Page Name&gt;:&lt;Group Name&gt;',
               '&lt;Page Id&gt;:&lt;Group Name&gt;',
               {group: '&lt;Group Name&gt;'},
               {group: '&lt;Group Id&gt;'},
               {page: '&lt;Page Name&gt;', group: '&lt;Group Name&gt;'},
               {page: '&lt;Page Id&gt;', group: '&lt;Group Name&gt;'}],
        hide: ['&lt;Group Name&gt;']
    },
    widgets: {
        show: ['&lt;Widget Name&gt;',
               '&lt;Widget Id&gt;',
               '&lt;Group Name&gt;:&lt;Widget Name&gt;',
               '&lt;Page Name&gt;:&lt;Group Name&gt;:&lt;Widget Name&gt;'],
        hide: ['&lt;Widget Id&gt;']
    }
}</pre>
    <h4>Enable/Disable Pages & Groups & Widgets</h4>
    <p>Dashboard pages & groups & widgets can be disabled & re-enabled by sending a <code>msg.payload</code> object with the format</p>
    <pre>msg.payload = {
    pages: {
        enable: ['&lt;Page Name&gt;'],
        disable: ['&lt;Page Name&gt;']
    },
    groups: {
        enable: ['&lt;Group Name&gt;'],
        disable: ['&lt;Group Name&gt;']
    }
}</pre>
    <p>When a (page, group or widget) name contains a colon <code>:</code>, that needs to be escaped using backslashes <code>\\</code>. </p>
    <h4>External URL</h4>
    <p>It is possible to trigger navigation to an external site, away from your Dashboard by passing in a URL string.</p>
    <pre>msg.payload = {
    url: 'https://url.goes.here'
}</pre>
    <p>You can also specify a target to open the link in a new browser window or tab.</p>
    <pre>msg.payload = {
    url: 'https://url.goes.here',
    target: '_blank'
}</pre>
    <h3>Events List</h3>
    <p>When any browser client connects or loses connection, changes tab, or expands or collapses a group this node will emit a <code>msg</code> containing:</p>
    <ul>
    <li><code>payload</code> - <i>connect</i>, <i>lost</i>, <i>change</i>, or <i>group</i>.
    <li><code>socketid</code> - the ID of the socket (this will change every time the browser reloads the page).
    <li><code>socketip</code> - the ip address from where the connection originated.
    <li><code>tab</code> - the number of the tab (only for 'change' event).
    <li><code>name</code> - the name of the tab (only for 'change' event).
    </ul>
    <p>Optional - report only connect events - useful to use to trigger a resend of data to a new client without needing to filter out other events.</p>
</script>
